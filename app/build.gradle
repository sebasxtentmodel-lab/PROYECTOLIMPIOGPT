plugins {
    id 'com.android.application'
}
android {
    namespace 'com.smartfk.keyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.smartfk.keyboard'
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName '0.10.2-startup-safe'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    androidResources { noCompress += ['bin', 'spm'] }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'

}
