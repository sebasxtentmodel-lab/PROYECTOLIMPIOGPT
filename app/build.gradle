plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.smartfk.keyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.smartfk.keyboard'
        minSdk 29
        targetSdk 35
        versionCode 15
        versionName '0.12.0-sherpa-turkish-qa'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    androidResources { noCompress += ['bin', 'spm', 'onnx', 'txt'] }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation('com.github.k2-fsa:sherpa-onnx:v1.13.8') {
        // Android AAR already contains the Kotlin API classes; exclude redundant JVM jar.
        exclude group: 'com.github.k2-fsa.sherpa-onnx', module: 'sherpa-onnx-jvm'
    }

}
