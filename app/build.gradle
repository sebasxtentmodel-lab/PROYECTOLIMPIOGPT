plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.smartfk.keyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.smartfk.keyboard'
        minSdk 29
        targetSdk 35
        versionCode 17
        versionName '0.12.2-rolling-asr-test'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    androidResources { noCompress += ['bin', 'spm', 'onnx', 'txt'] }
    // sherpa-onnx AAR/JVM jar contains native binaries for desktop operating
    // systems. Those are not executable on Android and inflated the APK >100 MB.
    packaging {
        resources {
            excludes += [
                'sherpa-onnx/native/**',
                '**/native/osx-*/**',
                '**/native/win-*/**',
                '**/native/linux-*/**'
            ]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'
    testImplementation 'junit:junit:4.13.2'
    implementation('com.github.k2-fsa:sherpa-onnx:v1.13.8') {
        // Android AAR already contains the Kotlin API classes; exclude redundant JVM jar.
        exclude group: 'com.github.k2-fsa.sherpa-onnx', module: 'sherpa-onnx-jvm'
    }

}
