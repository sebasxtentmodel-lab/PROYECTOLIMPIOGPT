name: SmartFk Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: smartfk-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download verified Vosk assets from earlier SmartFk build
        uses: actions/download-artifact@v4
        with:
          name: SmartFk-debug-apk
          run-id: 40838866923
          github-token: ${{ github.token }}
          path: /tmp/smartfk-prev
      - name: Bundle official Turkish and Spanish Vosk models
        shell: bash
        run: |
          set -euo pipefail
          unzip -qq /tmp/smartfk-prev/app-debug.apk 'assets/models/*' -d /tmp/smartfk-unpack
          mkdir -p app/src/main/assets/models
          cp -a /tmp/smartfk-unpack/assets/models/. app/src/main/assets/models/
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK contains both local ASR models
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q "^assets/models/tr/final.mdl$"
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q "^assets/models/es/am/final.mdl$"
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartFk-0.2.0-alpha-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
