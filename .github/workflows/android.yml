name: SmartFk Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: smartfk-neural-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reuse official Vosk Turkish and Spanish models
        uses: actions/download-artifact@v4
        with:
          name: SmartFk-debug-apk
          run-id: 40838866923
          github-token: ${{ github.token }}
          path: /tmp/smartfk-prev
      - name: Install official Vosk ASR models
        shell: bash
        run: |
          set -euo pipefail
          unzip -qq /tmp/smartfk-prev/app-debug.apk 'assets/models/*' -d /tmp/smartfk-unpack
          mkdir -p app/src/main/assets/models
          cp -a /tmp/smartfk-unpack/assets/models/. app/src/main/assets/models/
      - name: Bundle and verify real Mozilla neural models and WM native engines
        run: |
          python3 -m pip install --quiet zstandard
          python3 scripts/bundle_neural_models.py
      - name: Generate reproducible Turkish and Spanish speech test audio
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          mkdir -p app/src/debug/assets
          espeak-ng -v tr -s 125 -w /tmp/smartfk-tr.wav 'Merhaba. Nasılsın? Bugün hava çok güzel. Yarın saat dokuzda görüşebilir miyiz?'
          espeak-ng -v es -s 130 -w /tmp/smartfk-es.wav 'Hola, buenos días. Cómo estás? Mañana nos vemos a las nueve de la mañana.'
          ffmpeg -hide_banner -loglevel error -y -i /tmp/smartfk-tr.wav -ar 16000 -ac 1 -c:a pcm_s16le -f s16le app/src/debug/assets/tr_fixture.pcm
          ffmpeg -hide_banner -loglevel error -y -i /tmp/smartfk-es.wav -ar 16000 -ac 1 -c:a pcm_s16le -f s16le app/src/debug/assets/es_fixture.pcm
          ls -lh app/src/debug/assets/*.pcm
      - name: Build offline Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify complete ASR and neural assets in APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/apk-entries.txt
          for asset in assets/models/tr/final.mdl assets/models/es/am/final.mdl \
                       assets/bergamot/tr-en/model.bin assets/bergamot/en-es/model.bin \
                       assets/bergamot/es-en/model.bin assets/bergamot/en-tr/model.bin \
                       assets/whisper/ggml-tiny-q5_1.bin \
                       lib/arm64-v8a/libwmbergamot.so lib/arm64-v8a/libwmwhispercpp.so; do
            grep -Fxq "$asset" /tmp/apk-entries.txt || { echo "Missing $asset"; exit 1; }
          done
          sha256sum "$APK"
      - name: Publish SmartFk APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartFk-0.8.0-streaming-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    name: Android 13 keyboard and neural translator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmartFk-0.8.0-streaming-apk
          path: /tmp/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash scripts/ime-smoke.sh
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartFk-neural-emulator-diagnostics
          path: /tmp/smartfk-evidence/
          if-no-files-found: ignore
