name: SmartFk Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: smartfk-neural-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: STAGING · Compile offline engines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Cache verified official ASR archives
        uses: actions/cache@v4
        with:
          path: build-model-cache
          key: smartfk-vosk-pinned-v1-${{ hashFiles('scripts/bundle_vosk_models.py') }}
      - name: Download official Turkish and Spanish Vosk models
        run: python3 scripts/bundle_vosk_models.py
      - name: Bundle Turkish fine-tuned Whisper-ONNX model with SHA-256 verification
        run: python3 scripts/bundle_turkish_sherpa.py
      - name: Bundle and verify real Mozilla neural models and WM native engines
        run: |
          python3 -m pip install --quiet zstandard
          python3 scripts/bundle_neural_models.py
      - name: Generate reproducible Turkish and Spanish speech test audio
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          mkdir -p app/src/debug/assets
          espeak-ng -v tr -s 125 -w /tmp/smartfk-tr.wav 'Merhaba. Nasılsın? Bugün hava çok güzel. Yarın saat dokuzda görüşebilir miyiz?'
          espeak-ng -v es -s 130 -w /tmp/smartfk-es.wav 'Hola, buenos días. Cómo estás? Mañana nos vemos a las nueve de la mañana.'
          ffmpeg -hide_banner -loglevel error -y -i /tmp/smartfk-tr.wav -ar 16000 -ac 1 -c:a pcm_s16le -f s16le app/src/debug/assets/tr_fixture.pcm
          ffmpeg -hide_banner -loglevel error -y -i /tmp/smartfk-es.wav -ar 16000 -ac 1 -c:a pcm_s16le -f s16le app/src/debug/assets/es_fixture.pcm
          ls -lh app/src/debug/assets/*.pcm
      - name: Build staging and unsigned production APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Verify complete ASR and neural assets in APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/apk-entries.txt
          for asset in assets/models/tr/final.mdl assets/models/es/am/final.mdl \
                       assets/bergamot/tr-en/model.bin assets/bergamot/en-es/model.bin \
                       assets/bergamot/es-en/model.bin assets/bergamot/en-tr/model.bin \
                       assets/whisper/ggml-base-q5_1.bin \
                       assets/turkish-sherpa/base-tr-encoder.int8.onnx \
                       assets/turkish-sherpa/base-tr-decoder.int8.onnx \
                       assets/turkish-sherpa/tokens.txt \
                       lib/arm64-v8a/libwmbergamot.so lib/arm64-v8a/libwmwhispercpp.so; do
            grep -Fxq "$asset" /tmp/apk-entries.txt || { echo "Missing $asset"; exit 1; }
          done
          sha256sum "$APK"
      - name: Package complete standalone Android Studio source project with offline models
        shell: bash
        run: |
          set -euo pipefail
          # Include Gradle Wrapper so Android Studio can open and compile directly.
          gradle --no-daemon wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew
          STAGE=/tmp/smartfk-source-export/PROYECTOLIMPIOGPT
          mkdir -p "$STAGE"
          rsync -a \
            --exclude=.git \
            --exclude=.gradle \
            --exclude=.idea \
            --exclude=build \
            --exclude=build-model-cache \
            --exclude='app/build' \
            --exclude='local.properties' \
            ./ "$STAGE/"
          cat > "$STAGE/LEEME_COMPILAR.txt" <<'INSTRUCTIONS'
          PROYECTOLIMPIOGPT - SmartFk 0.12.0 - CODIGO COMPLETO
          
          Incluye:
           * Proyecto Android Studio, codigo Java, Gradle y Gradle Wrapper
           * Motores nativos WM Keyboard whisper.cpp y Bergamot
           * Modelos offline Vosk en espanol y turco
           * Modelo Whisper multilingue
           * Modelos neuronales Mozilla para TR-EN-ES y ES-EN-TR
           * Scripts de compilacion, diagnosticos y pruebas
          
          Para compilar en Android Studio: abrir esta carpeta como proyecto
          y ejecutar la tarea ':app:assembleDebug'. Necesita JDK 17 y Android SDK 35.
          Los motores/modelos ya vienen dentro de este ZIP, sin descargas adicionales
          de datos de IA; Gradle puede descargar dependencias de compilacion.
          La APK instalable se distribuye por separado.
          
          IMPORTANTE: no se ha validado el reconocimiento continuo real en
          un Infinix Smart 8. La compilacion y tests Android 13 no garantizan
          la precision de conversacion en ese telefono.
          INSTRUCTIONS
          cd /tmp/smartfk-source-export
          zip -q -r /tmp/PROYECTOLIMPIOGPT_SmartFk_0.12.0_COMPLETO.zip PROYECTOLIMPIOGPT
          unzip -tq /tmp/PROYECTOLIMPIOGPT_SmartFk_0.12.0_COMPLETO.zip
          ls -lh /tmp/PROYECTOLIMPIOGPT_SmartFk_0.12.0_COMPLETO.zip
          sha256sum /tmp/PROYECTOLIMPIOGPT_SmartFk_0.12.0_COMPLETO.zip
      - name: Publish complete editable SmartFk project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PROYECTOLIMPIOGPT-SmartFk-0.12.0-FULL-PROJECT-ZIP
          path: /tmp/PROYECTOLIMPIOGPT_SmartFk_0.12.0_COMPLETO.zip
          if-no-files-found: error
          compression-level: 0
      - name: Publish SmartFk APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartFk-0.12.0-STAGING-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preserve unsigned release for private production signing
        uses: actions/upload-artifact@v4
        with:
          name: SmartFk-0.12.0-UNSIGNED-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  emulator-smoke:
    name: STAGING · Android 13 offline voice and keyboard tests
    needs: build
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmartFk-0.12.0-STAGING-apk
          path: /tmp/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash scripts/ime-smoke.sh
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartFk-neural-emulator-diagnostics
          path: /tmp/smartfk-evidence/
          if-no-files-found: ignore

  qa-promotion:
    name: QA · Promote only after all staging tests pass
    needs: [build, emulator-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the exact tested APK
        uses: actions/download-artifact@v4
        with:
          name: SmartFk-0.12.0-STAGING-apk
          path: /tmp/verified
      - name: Download mandatory test evidence
        uses: actions/download-artifact@v4
        with:
          name: SmartFk-neural-emulator-diagnostics
          path: /tmp/evidence
      - name: Gate on actual speech quality and runtime success
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/verified/app-debug.apk
          test -s /tmp/evidence/TESTED_IN_STAGING.txt
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/evidence/quality.json'))
          assert d['status']=='PASS', 'Turkish or Spanish ASR failed quality gate'
          for lang in ('TR','ES'):
              assert d['languages'][lang]['passed'], f'{lang} speech recognition is inaccurate'
          print('PASS: independently verified speech quality')
          PY
          unzip -tq /tmp/verified/app-debug.apk
          sha256sum /tmp/verified/app-debug.apk > /tmp/verified/SHA256.txt
          cp /tmp/evidence/TESTED_IN_STAGING.txt /tmp/verified/QA_SCOPE.txt
          cp /tmp/evidence/quality.json /tmp/verified/ASR_QUALITY.json
      - name: Publish verified staging APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartFk-0.12.0-QA-VERIFIED-APK
          path: /tmp/verified/
          if-no-files-found: error

  production:
    name: PRODUCTION · Sign gated APK with private keystore
    needs: qa-promotion
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SmartFk-0.12.0-UNSIGNED-release
          path: /tmp/release
      - name: Sign using repository-owned protected secrets
        shell: bash
        env:
          SMARTFK_KEYSTORE_B64: ${{ secrets.SMARTFK_KEYSTORE_B64 }}
          SMARTFK_KEYSTORE_PASSWORD: ${{ secrets.SMARTFK_KEYSTORE_PASSWORD }}
          SMARTFK_KEY_ALIAS: ${{ secrets.SMARTFK_KEY_ALIAS }}
          SMARTFK_KEY_PASSWORD: ${{ secrets.SMARTFK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SMARTFK_KEYSTORE_B64" || { echo "Missing protected production keystore secret"; exit 1; }
          test -n "$SMARTFK_KEYSTORE_PASSWORD" || exit 1
          test -n "$SMARTFK_KEY_ALIAS" || exit 1
          export SMARTFK_KEY_PASSWORD="${SMARTFK_KEY_PASSWORD:-$SMARTFK_KEYSTORE_PASSWORD}"
          umask 077
          printf '%s' "$SMARTFK_KEYSTORE_B64" | base64 -d > /tmp/release/signing.jks
          BT=$(find /usr/local/lib/android/sdk/build-tools -type f -name apksigner | sort -V | tail -n1)
          TOOLS=$(dirname "$BT")
          "$TOOLS/zipalign" -f -p 4 /tmp/release/app-release-unsigned.apk /tmp/release/SmartFk-aligned.apk
          "$BT" sign --ks /tmp/release/signing.jks --ks-key-alias "$SMARTFK_KEY_ALIAS" \
            --ks-pass env:SMARTFK_KEYSTORE_PASSWORD --key-pass env:SMARTFK_KEY_PASSWORD \
            --out /tmp/release/SmartFk-PRODUCTION.apk /tmp/release/SmartFk-aligned.apk
          "$BT" verify --verbose /tmp/release/SmartFk-PRODUCTION.apk
          sha256sum /tmp/release/SmartFk-PRODUCTION.apk > /tmp/release/SHA256.txt
          rm -f /tmp/release/signing.jks /tmp/release/SmartFk-aligned.apk /tmp/release/app-release-unsigned.apk
      - name: Publish signed production APK only after validation
        uses: actions/upload-artifact@v4
        with:
          name: SmartFk-0.12.0-PRODUCTION-SIGNED
          path: |
            /tmp/release/SmartFk-PRODUCTION.apk
            /tmp/release/SHA256.txt
          if-no-files-found: error
