name: SmartFk Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: smartfk-build-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download verified Vosk assets from earlier SmartFk build
        uses: actions/download-artifact@v4
        with:
          name: SmartFk-debug-apk
          run-id: 40838866923
          github-token: ${{ github.token }}
          path: /tmp/smartfk-prev
      - name: Bundle official Turkish and Spanish Vosk models
        shell: bash
        run: |
          set -euo pipefail
          unzip -qq /tmp/smartfk-prev/app-debug.apk 'assets/models/*' -d /tmp/smartfk-unpack
          mkdir -p app/src/main/assets/models
          cp -a /tmp/smartfk-unpack/assets/models/. app/src/main/assets/models/
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK contains both local ASR models
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q "^assets/models/tr/final.mdl$"
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q "^assets/models/es/am/final.mdl$"
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartFk-0.5.0-alpha-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    name: Test keyboard opening on Android 13 emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmartFk-0.5.0-alpha-apk
          path: /tmp/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android emulator and test IME activation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            set -e
            adb install /tmp/apk/app-debug.apk
            adb shell pm grant com.smartfk.keyboard android.permission.RECORD_AUDIO
            adb shell ime enable com.smartfk.keyboard/.SmartFkInputMethod
            adb shell ime set com.smartfk.keyboard/.SmartFkInputMethod
            adb shell am start -n com.smartfk.keyboard/.SetupActivity
            sleep 4
            adb shell input swipe 400 1400 400 470 400
            sleep 2
            adb shell uiautomator dump /sdcard/smartfk-ui.xml
            adb exec-out cat /sdcard/smartfk-ui.xml > /tmp/smartfk-ui.xml
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            tree=ET.parse('/tmp/smartfk-ui.xml')
            fields=[n for n in tree.iter() if n.get('class')=='android.widget.EditText']
            if not fields: raise RuntimeError('SmartFk text field not found')
            m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',fields[0].get('bounds',''))
            if not m: raise RuntimeError('EditText missing bounds')
            x1,y1,x2,y2=map(int,m.groups())
            subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
            PY
            sleep 12
            adb shell dumpsys input_method | grep -q 'com.smartfk.keyboard'
            adb logcat -d -v brief > /tmp/smartfk-logcat.txt
            if grep -A 12 'FATAL EXCEPTION' /tmp/smartfk-logcat.txt | grep -q 'com.smartfk.keyboard'; then
              grep -A 25 'FATAL EXCEPTION' /tmp/smartfk-logcat.txt | tail -50
              exit 1
            fi
            echo 'Android 13: app installed, keyboard selected, no SmartFk fatal crash'
